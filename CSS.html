<style>

* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

:root {

  --primary: #397EF6;
  --primary-dark: #2468D9;

  --success: #16A34A;
  --success-bg: #EAF8EF;

  --danger: #DC2626;
  --danger-bg: #FFF0F0;

  --warning: #F59E0B;

  --text: #172033;
  --muted: #7A8497;

  --background: #F6F8FC;
  --surface: #FFFFFF;

  --border: #E8ECF3;

  --shadow:
    0 8px 30px rgba(27, 48, 84, .08);

  --radius: 18px;

}

html,
body {

  margin: 0;

  padding: 0;

  width: 100%;

  min-height: 100%;

  font-family:
    "Cairo",
    sans-serif;

  background:
    var(--background);

  color:
    var(--text);

}

body {

  overflow-x: hidden;

}

button,
input {

  font-family:
    inherit;

}

button {

  border: 0;

  cursor: pointer;

}

#app {

  min-height: 100vh;

  padding-bottom: 90px;

}


/* =====================================================
   TOP BAR
===================================================== */

.topbar {

  height: 76px;

  background:
    var(--surface);

  display: flex;

  align-items: center;

  justify-content: space-between;

  padding:
    0 20px;

  border-bottom:
    1px solid var(--border);

  position: sticky;

  top: 0;

  z-index: 20;

}

.topbar-title {

  display: flex;

  flex-direction: column;

  gap: 1px;

}

.app-title {

  font-size: 19px;

  font-weight: 800;

}

.app-subtitle {

  color:
    var(--muted);

  font-size: 11px;

}

.topbar-icon {

  width: 42px;

  height: 42px;

  border-radius: 14px;

  background:
    #EEF4FF;

  color:
    var(--primary);

  display: flex;

  align-items: center;

  justify-content: center;

  font-size: 20px;

}


/* =====================================================
   MAIN
===================================================== */

.main-content {

  max-width: 700px;

  margin: auto;

  padding:
    22px 16px 30px;

}

.page-heading {

  display: flex;

  justify-content: space-between;

  align-items: center;

  margin-bottom: 18px;

}

.page-heading h1 {

  margin: 0;

  font-size: 26px;

  font-weight: 800;

}

.page-heading p {

  margin: 3px 0 0;

  color:
    var(--muted);

  font-size: 12px;

}


/* =====================================================
   SEARCH
===================================================== */

.home-search,
.search-box {

  height: 50px;

  background:
    var(--surface);

  border:
    1px solid var(--border);

  border-radius:
    15px;

  display: flex;

  align-items: center;

  padding:
    0 15px;

  gap: 10px;

  box-shadow:
    0 4px 15px rgba(30, 50, 80, .03);

}

.home-search {

  margin-bottom: 13px;

}

.home-search span,
.search-box span {

  font-size: 23px;

  color:
    var(--muted);

}

.home-search input,
.search-box input {

  width: 100%;

  border: 0;

  outline: 0;

  background: transparent;

  color:
    var(--text);

  font-size: 13px;

}

.home-search input::placeholder,
.search-box input::placeholder {

  color:
    #A4ADBC;

}


/* =====================================================
   FILTERS
===================================================== */

.filter-row {

  display: flex;

  gap: 8px;

  overflow-x: auto;

  padding-bottom: 5px;

}

.filter-chip {

  flex-shrink: 0;

  padding:
    8px 15px;

  border-radius: 30px;

  background:
    var(--surface);

  border:
    1px solid var(--border);

  color:
    var(--muted);

  font-size: 12px;

}

.filter-chip.active {

  background:
    var(--primary);

  border-color:
    var(--primary);

  color:
    white;

}


/* =====================================================
   ACTIVITY CARD
===================================================== */

.activities-list {

  display: flex;

  flex-direction: column;

  gap: 14px;

  margin-top: 17px;

}

.activity-card {

  background:
    var(--surface);

  border:
    1px solid var(--border);

  border-radius:
    20px;

  box-shadow:
    var(--shadow);

  overflow: hidden;

}

.activity-card-header {

  padding:
    18px;

  display: flex;

  align-items: center;

  justify-content: space-between;

  gap: 15px;

  cursor: pointer;

}

.activity-main {

  display: flex;

  align-items: center;

  gap: 12px;

  min-width: 0;

}

.activity-icon {

  width: 46px;

  height: 46px;

  border-radius: 14px;

  display: flex;

  align-items: center;

  justify-content: center;

  font-size: 22px;

  flex-shrink: 0;

}

.activity-icon.course {

  background:
    #EEF4FF;

}

.activity-icon.meeting {

  background:
    #EFFAF3;

}

.activity-main h3 {

  margin: 0;

  font-size: 14px;

  font-weight: 800;

  white-space: nowrap;

  overflow: hidden;

  text-overflow: ellipsis;

}

.activity-type {

  color:
    var(--muted);

  font-size: 10px;

}

.activity-total {

  text-align: center;

  min-width: 55px;

}

.activity-total strong {

  display: block;

  color:
    var(--primary);

  font-size: 22px;

  line-height: 1;

}

.activity-total span {

  color:
    var(--muted);

  font-size: 9px;

}


/* =====================================================
   ACTIVITY ACTIONS
===================================================== */

.activity-actions {

  display: flex;

  align-items: center;

  gap: 7px;

  padding:
    0 15px 14px;

}

.outline-action {

  flex: 1;

  height: 40px;

  background:
    #F7F9FD;

  color:
    var(--primary);

  border:
    1px solid #E0E8F7;

  border-radius: 11px;

  font-size: 11px;

}

.text-action {

  height: 40px;

  padding:
    0 10px;

  background:
    transparent;

  color:
    var(--primary);

  font-size: 11px;

}

.expand-btn {

  width: 38px;

  height: 38px;

  border-radius: 11px;

  background:
    #F1F5FC;

  color:
    var(--primary);

  font-size: 18px;

}


/* =====================================================
   LECTURES
===================================================== */

.lectures-container {

  max-height: 0;

  overflow: hidden;

  background:
    #FAFBFE;

  transition:
    max-height .3s ease;

}

.lectures-container.show {

  max-height: 1000px;

}

.lecture-row {

  padding:
    13px 17px;

  border-top:
    1px solid var(--border);

  display: flex;

  justify-content: space-between;

  align-items: center;

  cursor: pointer;

}

.lecture-name {

  font-size: 12px;

  font-weight: 700;

}

.lecture-meta {

  color:
    var(--muted);

  font-size: 10px;

  margin-top: 2px;

}

.lecture-actions {

  display: flex;

  align-items: center;

  gap: 9px;

  color:
    var(--primary);

}

.lecture-edit {

  width: 30px;

  height: 30px;

  border-radius: 9px;

  background:
    white;

  color:
    var(--muted);

}

.no-lectures {

  padding: 18px;

  text-align: center;

  color:
    var(--muted);

  font-size: 11px;

}


/* =====================================================
   BOTTOM NAV
===================================================== */

.bottom-nav {

  position: fixed;

  bottom: 0;

  right: 0;

  left: 0;

  height: 70px;

  background:
    rgba(255,255,255,.96);

  backdrop-filter:
    blur(15px);

  border-top:
    1px solid var(--border);

  display: flex;

  align-items: center;

  justify-content: center;

  gap: 70px;

  z-index: 30;

}

.nav-item {

  background:
    transparent;

  color:
    #A0A8B6;

  display: flex;

  flex-direction: column;

  align-items: center;

  gap: 2px;

  font-size: 10px;

}

.nav-icon {

  font-size: 20px;

}

.nav-item.active {

  color:
    var(--primary);

}


/* =====================================================
   FAB
===================================================== */

.main-fab {

  position: fixed;

  bottom: 84px;

  left: 20px;

  width: 57px;

  height: 57px;

  border-radius: 50%;

  background:
    var(--primary);

  color:
    white;

  font-size: 30px;

  display: flex;

  align-items: center;

  justify-content: center;

  box-shadow:
    0 10px 25px rgba(57,126,246,.35);

  z-index: 50;

}

.main-fab:active {

  transform:
    scale(.94);

}

.fab-menu {

  position: fixed;

  bottom: 150px;

  left: 20px;

  width: 235px;

  display: flex;

  flex-direction: column;

  gap: 10px;

  opacity: 0;

  visibility: hidden;

  transform:
    translateY(15px);

  transition:
    .2s ease;

  z-index: 49;

}

.fab-menu.show {

  opacity: 1;

  visibility: visible;

  transform:
    translateY(0);

}

.fab-option {

  background:
    white;

  border:
    1px solid var(--border);

  border-radius: 16px;

  padding:
    12px;

  display: flex;

  align-items: center;

  gap: 12px;

  text-align: right;

  box-shadow:
    var(--shadow);

}

.fab-option-icon {

  width: 40px;

  height: 40px;

  border-radius: 12px;

  display: flex;

  align-items: center;

  justify-content: center;

  font-size: 20px;

  background:
    #EEF4FF;

}

.fab-option strong {

  display: block;

  font-size: 12px;

}

.fab-option small {

  display: block;

  color:
    var(--muted);

  font-size: 9px;

}


/* =====================================================
   OVERLAY
===================================================== */

.overlay {

  position: fixed;

  inset: 0;

  background:
    rgba(10,20,40,.35);

  opacity: 0;

  visibility: hidden;

  transition:
    .2s;

  z-index: 70;

}

.overlay.show {

  opacity: 1;

  visibility: visible;

}


/* =====================================================
   BOTTOM SHEET
===================================================== */

.bottom-sheet {

  position: fixed;

  left: 0;

  right: 0;

  bottom: 0;

  background:
    white;

  border-radius:
    25px 25px 0 0;

  padding:
    12px 20px 25px;

  z-index: 80;

  transform:
    translateY(110%);

  transition:
    transform .3s ease;

  max-height:
    90vh;

  overflow-y:
    auto;

}

.bottom-sheet.show {

  transform:
    translateY(0);

}

.sheet-handle {

  width: 45px;

  height: 5px;

  background:
    #DDE2EA;

  border-radius: 10px;

  margin:
    0 auto 18px;

}

.sheet-header {

  display: flex;

  justify-content: space-between;

  align-items: flex-start;

  gap: 15px;

  margin-bottom: 20px;

}

.sheet-header h2 {

  margin: 0;

  font-size: 19px;

}

.sheet-header p {

  margin: 3px 0 0;

  color:
    var(--muted);

  font-size: 11px;

}

.close-btn {

  width: 34px;

  height: 34px;

  border-radius: 10px;

  background:
    #F2F4F8;

  color:
    var(--muted);

  font-size: 20px;

}


/* =====================================================
   FORM
===================================================== */

.form-group {

  margin-bottom: 17px;

}

.form-group label {

  display: block;

  margin-bottom: 7px;

  font-size: 12px;

  font-weight: 700;

}

.text-input {

  width: 100%;

  height: 52px;

  border:
    1px solid var(--border);

  border-radius: 14px;

  padding:
    0 15px;

  outline: none;

  font-size: 13px;

  color:
    var(--text);

  background:
    #FAFBFD;

}

.text-input:focus {

  border-color:
    var(--primary);

  background:
    white;

}


/* =====================================================
   BUTTONS
===================================================== */

.primary-btn {

  width: 100%;

  height: 50px;

  border-radius: 14px;

  background:
    var(--primary);

  color:
    white;

  font-size: 13px;

  font-weight: 700;

}

.primary-btn:active {

  background:
    var(--primary-dark);

}

.secondary-btn {

  flex: 1;

  height: 50px;

  border-radius: 14px;

  background:
    #F1F3F7;

  color:
    var(--text);

  font-size: 13px;

  font-weight: 700;

}

.two-buttons {

  display: flex;

  gap: 10px;

}


/* =====================================================
   SCAN SCREEN
===================================================== */

.full-screen {

  position: fixed;

  inset: 0;

  background:
    #101722;

  z-index: 100;

  display: flex;

  flex-direction: column;

  transform:
    translateX(100%);

  transition:
    transform .3s ease;

}

.full-screen.show {

  transform:
    translateX(0);

}

.scan-header {

  padding:
    20px;

  color:
    white;

  display: flex;

  align-items: center;

  gap: 15px;

}

.scan-header h2 {

  margin: 0;

  font-size: 18px;

}

.scan-header span {

  color:
    #AEB8C9;

  font-size: 10px;

}

.back-btn {

  width: 42px;

  height: 42px;

  border-radius: 13px;

  background:
    rgba(255,255,255,.1);

  color:
    white;

  font-size: 23px;

  display: flex;

  align-items: center;

  justify-content: center;

}


/* =====================================================
   CAMERA
===================================================== */

.scanner-wrapper {

  flex: 1;

  position: relative;

  display: flex;

  align-items: center;

  justify-content: center;

  overflow: hidden;

}

.qr-reader {

  position: absolute;

  inset: 0;

  width: 100%;

  height: 100%;

}

.qr-reader video {

  width: 100% !important;

  height: 100% !important;

  object-fit: cover !important;

}

.qr-reader img {

  display: none !important;

}

.qr-reader__scan_region {

  height: 100% !important;

}

.qr-reader__dashboard {

  display: none !important;

}


/* Scanner overlay */

.scanner-wrapper::after {

  content: "";

  position: absolute;

  inset: 0;

  background:
    rgba(0,0,0,.28);

  pointer-events: none;

}

.scanner-frame {

  position: relative;

  z-index: 5;

  width: 260px;

  height: 260px;

  border-radius: 25px;

}

.scanner-corner {

  position: absolute;

  width: 40px;

  height: 40px;

  border-color:
    #4E8CFF;

  border-style:
    solid;

}

.top-right {

  top: 0;

  right: 0;

  border-width:
    4px 4px 0 0;

  border-radius:
    0 15px 0 0;

}

.top-left {

  top: 0;

  left: 0;

  border-width:
    4px 0 0 4px;

  border-radius:
    15px 0 0 0;

}

.bottom-right {

  bottom: 0;

  right: 0;

  border-width:
    0 4px 4px 0;

  border-radius:
    0 0 15px 0;

}

.bottom-left {

  bottom: 0;

  left: 0;

  border-width:
    0 0 4px 4px;

  border-radius:
    0 0 0 15px;

}

.scanner-line {

  position: absolute;

  left: 15px;

  right: 15px;

  top: 50%;

  height: 2px;

  background:
    #4E8CFF;

  box-shadow:
    0 0 10px #4E8CFF;

  animation:
    scanLine 2s infinite ease-in-out;

}

@keyframes scanLine {

  0% {
    transform: translateY(-100px);
  }

  50% {
    transform: translateY(100px);
  }

  100% {
    transform: translateY(-100px);
  }

}

.scanner-text {

  position: absolute;

  z-index: 10;

  bottom: 35px;

  color:
    white;

  font-size: 12px;

  background:
    rgba(0,0,0,.4);

  padding:
    8px 15px;

  border-radius: 30px;

}


/* =====================================================
   MANUAL SCAN BUTTON
===================================================== */

.manual-scan-btn {

  margin:
    15px 20px 30px;

  height: 55px;

  border-radius: 16px;

  background:
    white;

  color:
    var(--text);

  font-size: 14px;

  font-weight: 700;

  display: flex;

  align-items: center;

  justify-content: center;

  gap: 10px;

  z-index: 10;

}


/* =====================================================
   MANUAL LIST
===================================================== */

.manual-names-list {

  max-height: 250px;

  overflow-y: auto;

  display: flex;

  flex-direction: column;

  gap: 7px;

}

.manual-person-row {

  display: flex;

  align-items: center;

  justify-content: space-between;

  padding:
    11px;

  background:
    #F8FAFD;

  border:
    1px solid var(--border);

  border-radius: 13px;

}

.manual-person-row strong {

  display: block;

  font-size: 12px;

}

.manual-person-row span {

  display: block;

  color:
    var(--muted);

  font-size: 9px;

}

.add-person-btn {

  width: 38px;

  height: 38px;

  border-radius: 11px;

  background:
    var(--primary);

  color:
    white;

  font-size: 23px;

}

.already-added {

  color:
    var(--success) !important;

  background:
    var(--success-bg);

  padding:
    5px 8px;

  border-radius: 8px;

}

.manual-divider {

  text-align: center;

  margin:
    18px 0;

  color:
    var(--muted);

  font-size: 10px;

  position: relative;

}

.manual-divider::before,
.manual-divider::after {

  content: "";

  position: absolute;

  top: 50%;

  width: 43%;

  height: 1px;

  background:
    var(--border);

}

.manual-divider::before {

  right: 0;

}

.manual-divider::after {

  left: 0;

}


/* =====================================================
   SMALL MODAL
===================================================== */

.small-modal {

  position: fixed;

  z-index: 90;

  left: 50%;

  top: 50%;

  width: calc(100% - 40px);

  max-width: 400px;

  background:
    white;

  border-radius: 22px;

  padding: 24px;

  text-align: center;

  transform:
    translate(-50%, -45%);

  opacity: 0;

  visibility: hidden;

  transition:
    .2s;

  box-shadow:
    0 25px 70px rgba(0,0,0,.18);

}

.small-modal.show {

  opacity: 1;

  visibility: visible;

  transform:
    translate(-50%, -50%);

}

.small-modal-icon {

  width: 55px;

  height: 55px;

  border-radius: 50%;

  background:
    #EEF4FF;

  margin:
    0 auto 12px;

  display: flex;

  align-items: center;

  justify-content: center;

  font-size: 24px;

}

.small-modal h3 {

  margin: 0;

  font-size: 15px;

}

.small-modal p {

  margin:
    10px 0 2px;

  color:
    var(--muted);

  font-size: 11px;

}

.small-modal strong {

  display: block;

  margin-bottom: 20px;

  color:
    var(--primary);

  font-size: 13px;

}


/* =====================================================
   DETAILS
===================================================== */

.details-header {

  display: flex;

  align-items: center;

  gap: 12px;

  margin-bottom: 20px;

}

.details-header .back-btn {

  background:
    white;

  color:
    var(--text);

  border:
    1px solid var(--border);

}

.details-header h1 {

  margin: 0;

  font-size: 20px;

}

.details-header span {

  color:
    var(--muted);

  font-size: 10px;

}

.stats-grid {

  display: grid;

  grid-template-columns:
    1fr 1fr;

  gap: 10px;

  margin-bottom: 25px;

}

.stat-card {

  background:
    white;

  border:
    1px solid var(--border);

  border-radius:
    16px;

  padding:
    15px;

}

.stat-card span {

  display: block;

  color:
    var(--muted);

  font-size: 10px;

}

.stat-card strong {

  display: block;

  margin-top: 3px;

  color:
    var(--primary);

  font-size: 25px;

}

.section-title-row {

  display: flex;

  align-items: center;

  justify-content: space-between;

  margin-bottom: 12px;

}

.section-title-row h2 {

  margin: 0;

  font-size: 16px;

}

.small-primary-btn {

  padding:
    8px 12px;

  border-radius: 10px;

  background:
    var(--primary);

  color:
    white;

  font-size: 10px;

}

.detail-lectures {

  display: flex;

  flex-direction: column;

  gap: 10px;

}

.detail-lecture-card {

  background:
    white;

  border:
    1px solid var(--border);

  border-radius:
    16px;

  padding:
    13px;

}

.detail-lecture-main {

  display: flex;

  align-items: center;

  gap: 12px;

  cursor: pointer;

}

.lecture-calendar {

  width: 42px;

  height: 42px;

  background:
    #EEF4FF;

  border-radius:
    12px;

  display: flex;

  align-items: center;

  justify-content: center;

}

.detail-lecture-main h3 {

  margin: 0;

  font-size: 12px;

}

.detail-lecture-main p {

  margin: 2px 0 0;

  color:
    var(--muted);

  font-size: 9px;

}

.detail-lecture-buttons {

  display: flex;

  gap: 7px;

  margin-top: 10px;

}

.detail-lecture-buttons button {

  flex: 1;

  height: 35px;

  border-radius: 9px;

  background:
    #F5F7FB;

  color:
    var(--primary);

  font-size: 10px;

}

.full-attendance-btn {

  width: 100%;

  height: 50px;

  margin-top: 18px;

  border-radius:
    14px;

  background:
    white;

  border:
    1px solid var(--border);

  color:
    var(--primary);

  display: flex;

  justify-content: space-between;

  align-items: center;

  padding:
    0 15px;

  font-size: 12px;

}


/* =====================================================
   ATTENDANCE
===================================================== */
